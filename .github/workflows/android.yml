name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Build a signed release APK (requires Android signing secrets)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "android/**"
      - "web/**"
      - "internal/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    name: Android APK + Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Read application version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^var version = "\([^"]*\)"/\1/p' main.go)
          if [ -z "$version" ]; then
            echo "Unable to read version from main.go" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Test Android-related Go packages
        run: go test . ./internal/config ./internal/netutil ./internal/engine ./internal/server ./internal/cloud ./internal/library

      - name: Build Android backend
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          go build -trimpath -ldflags "-s -w" \
            -o android/app/src/main/jniLibs/arm64-v8a/libiptest.so .

      - name: Prepare release keystore
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_build == true) }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "Missing required secret: $value" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iptest-release.keystore"

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.release_build != true) }}
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.value }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: gradle assembleDebug --no-daemon

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_build == true) }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/iptest-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.value }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: gradle assembleRelease --no-daemon

      - name: Collect and verify APK
        id: apk
        shell: bash
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            source=android/app/build/outputs/apk/release/app-release.apk
            kind=release
          else
            source=android/app/build/outputs/apk/debug/app-debug.apk
            kind=debug
          fi
          unzip -l "$source" | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libiptest.so" apk-contents.txt
          mkdir -p release_assets
          target="release_assets/iptest-web-android-arm64-${{ steps.version.outputs.value }}-${kind}.apk"
          cp "$source" "$target"
          sha256sum "$target" > "$target.sha256"
          echo "path=$target" >> "$GITHUB_OUTPUT"

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "release_assets/iptest-web-${{ steps.version.outputs.value }}.exe" .
          sha256sum "release_assets/iptest-web-${{ steps.version.outputs.value }}.exe" \
            > "release_assets/iptest-web-${{ steps.version.outputs.value }}.exe.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptest-web-android-arm64-${{ steps.version.outputs.value }}
          path: release_assets/*
          if-no-files-found: error
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          fail_on_unmatched_files: true