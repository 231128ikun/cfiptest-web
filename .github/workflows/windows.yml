name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "web/**"
      - "internal/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

jobs:
  build:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go packages
        run: go test ./...

      - name: Build Windows executable
        shell: bash
        run: |
          version=$(sed -n 's/^var version = "\([^"]*\)"/\1/p' main.go)
          mkdir -p release_assets
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" \
            -o "release_assets/iptest-web-${version}.exe" .

      - name: Smoke test binary
        shell: bash
        run: |
          version=$(sed -n 's/^var version = "\([^"]*\)"/\1/p' main.go)
          bin=$(ls release_assets/iptest-web-${version}* 2>/dev/null | head -n1)
          if [ -z "$bin" ]; then
            echo "未找到产物 release_assets/iptest-web-${version}*" >&2
            exit 1
          fi
          "$bin" -port 18081 -no-browser > smoke.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18081/api/config" 2>/dev/null | grep -q "\"version\":\"${version}\""; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat smoke.log
          if [ "$ok" != "1" ]; then
            echo "冒烟验证失败：/api/config 未返回版本号 ${version}" >&2
            exit 1
          fi
          echo "冒烟验证通过：二进制返回版本号 ${version}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptest-web-windows-amd64
          path: release_assets/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          fail_on_unmatched_files: true